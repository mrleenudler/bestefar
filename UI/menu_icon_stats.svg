<svg xmlns="http://www.w3.org/2000/svg" width="1550" height="1000" viewBox="0 0 1550 1000">
<rect width="1550" height="1000" fill="#ffffff"></rect>

<defs>
  <!-- Clip disk for the magnified bar: slightly smaller than the lens interior,
       so the bar never touches the ring -->
  <clipPath id="lens">
    <circle cx="1065" cy="340" r="145"/>
  </clipPath>
</defs>

<!-- Bars: baseline y=950, heights 450/760/560/700/360 (non-monotonic) -->
<g fill="#000000">
  <rect x="100"  y="500" width="190" height="450" rx="14"/>
  <rect x="390"  y="190" width="190" height="760" rx="14"/>
  <rect x="680"  y="390" width="190" height="560" rx="14"/>
  <rect x="970"  y="250" width="190" height="700" rx="14"/>
  <rect x="1260" y="590" width="190" height="360" rx="14"/>
</g>

<!-- White halo so the glass stays readable where it crosses black bars -->
<g stroke="#ffffff" fill="none" stroke-linecap="round">
  <circle cx="1065" cy="340" r="200" stroke-width="120"/>
  <line x1="1206" y1="481" x2="1301" y2="576" stroke-width="144"/>
</g>

<!-- Lens interior: white, then bar 4 magnified 1.25x horizontally about the
     lens axis, clipped so it floats free of the ring -->
<circle cx="1065" cy="340" r="172" fill="#ffffff"/>
<rect x="946.25" y="250" width="237.5" height="700" rx="18" fill="#000000" clip-path="url(#lens)"/>

<!-- Magnifying glass: centre moved up-left to (1065, 340), r=200 -->
<circle cx="1065" cy="340" r="200" fill="none" stroke="#000000" stroke-width="56"/>
<line x1="1206" y1="481" x2="1301" y2="576" stroke="#000000" stroke-width="88" stroke-linecap="round"/>
</svg>
