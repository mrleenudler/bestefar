name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: C++-kjerne (bygg + enhetsnivaa)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer OpenCV
        run: sudo apt-get update && sudo apt-get install -y libopencv-dev ninja-build
      - name: Konfigurer og bygg
        run: |
          cmake -S core -B core/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build core/build
      - name: Roekt-test CLI
        run: core/build/bestefar_cli || test $? -eq 2   # exit 2 = riktig bruksmelding
      # C-sett-verifisering (verify_cset_cpp.py) kjoeres LOKALT:
      # testbildene er for store for repoet/CI. Krav foer merge: 10/10.

  android:
    name: Android (assembleDebug)
    runs-on: ubuntu-latest
    # Deaktivert til OpenCV-Android-SDK-nedlasting er kablet inn i workflowen.
    if: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Last ned OpenCV Android SDK
        run: |
          curl -L -o opencv.zip https://github.com/opencv/opencv/releases/download/4.10.0/opencv-4.10.0-android-sdk.zip
          unzip -q opencv.zip
          echo "opencvDir=$PWD/OpenCV-android-sdk/sdk/native/jni" >> android/gradle.properties
      - name: Bygg
        working-directory: android
        run: gradle assembleDebug

  backend:
    name: Backend (import + kompilering)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Installer og roekt-test
        run: |
          pip install -r backend/requirements.txt
          cd backend && python -c "from app.main import app; print(len(app.routes), 'ruter')"
