name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: C++-kjerne (bygg + enhetsnivaa)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer OpenCV
        run: sudo apt-get update && sudo apt-get install -y libopencv-dev ninja-build
      - name: Konfigurer og bygg
        run: |
          cmake -S core -B core/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build core/build
      - name: Roekt-test CLI
        run: core/build/bestefar_cli || test $? -eq 2   # exit 2 = riktig bruksmelding
      # C-sett-verifisering (verify_cset_cpp.py) kjoeres LOKALT:
      # testbildene er for store for repoet/CI. Krav foer merge: 10/10.

  # KUN debug. Release krever signeringsnoekkelen, og den ligger utenfor repoet
  # (android/keystore.properties + .keystore, begge gitignorert). En
  # signeringsnoekkel i CI ville vaert en noekkel paa avveie som fortjener det.
  #
  # Jobben dekker to ting kjernejobben over IKKE dekker: Kotlin-kompilering med
  # ressurs- og manifestlenking, og NDK-bygget av core/. Se «NDK-bygget er ikke
  # dobbeltarbeid» under.
  android:
    name: Android (assembleDebug + NDK-bygg av core)
    runs-on: ubuntu-latest
    # Uten tak kan en hengende SDK-nedlasting brenne seks timer per kjoering.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      # BUFRINGEN ER IKKE EN OPTIMALISERING. Uten den bruker jobben flere
      # minutter paa aa laste ned det samme hver gang, og en jobb som er treig
      # nok blir slaatt av - som er tilstanden dette punktet skulle rette opp
      # (AAPNE_PUNKTER ÅP-U12).
      - name: OpenCV Android SDK (bufret)
        id: opencv
        uses: actions/cache@v4
        with:
          path: opencv-android-sdk
          # Versjonen staar i noekkelen: bumper vi SDK-en, faller bufferen bort
          # av seg selv i stedet for aa levere feil versjon i stillhet.
          key: opencv-android-sdk-4.10.0

      - name: Last ned OpenCV Android SDK
        if: steps.opencv.outputs.cache-hit != 'true'
        run: |
          curl -sSfL -o opencv.zip \
            https://github.com/opencv/opencv/releases/download/4.10.0/opencv-4.10.0-android-sdk.zip
          unzip -q opencv.zip
          mv OpenCV-android-sdk opencv-android-sdk

      # AGP laster ned NDK og CMake selv naar versjonene ikke ligger i
      # runner-bildet. Det er ~1 GB, og det er den enkeltposten som avgjoer om
      # jobben tar tre minutter eller femten.
      - name: NDK og CMake (bufret)
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/ndk
            /usr/local/lib/android/sdk/cmake
          key: android-ndk-cmake-${{ hashFiles('android/app/build.gradle.kts', 'android/app/src/main/cpp/CMakeLists.txt') }}
          restore-keys: android-ndk-cmake-

      - uses: gradle/actions/setup-gradle@v4

      # Wrapperen, ikke `gradle` fra bildet: AGP 9.2.0 krever Gradle 9.4.1, og
      # runnerens egen Gradle er en annen versjon. `-PopencvDir` overstyrer
      # verdien i gradle.properties, som peker paa utviklerens Windows-sti.
      - name: assembleDebug
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug -PopencvDir="$GITHUB_WORKSPACE/opencv-android-sdk/sdk/native/jni"

      # EN GROENN JOBB SOM IKKE BYGGET NOE ER VERRE ENN EN AVSLAATT, fordi den
      # ser ut som dekning. Derfor sjekkes utfallet, ikke bare exit-koden:
      # APK-en skal finnes, og den skal inneholde det NDK-bygde biblioteket.
      # Faller add_subdirectory av core/ ut av byggingen, fanges det her.
      - name: APK-en finnes og inneholder kjernen
        run: |
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          unzip -l "$apk" | grep -q 'lib/arm64-v8a/libbestefar_jni.so'

  backend:
    name: Backend (tester)
    runs-on: ubuntu-latest
    # Postgres er produksjonsdialekten. Skjemaet `research` finnes bare der
    # (SQLite har ikke skjemaer), saa driftsjekken mellom modeller og
    # migrasjoner kan bare kjoere her.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bestefar_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Installer
        run: pip install -r backend/requirements-dev.txt
      - name: Roekt-test import
        working-directory: backend
        run: python -c "from app.main import app; print(len(app.routes), 'ruter')"

      # contracts/openapi.json er en DELT kontraktflate UI-instansen leser uten
      # aa kjoere backenden. En innsjekket kontrakt som stille kommer i utakt
      # med koden er verre enn ingen kontrakt - da bygges det mot noe som ser
      # autoritativt ut uten aa vaere det. Derfor regenereres den her og
      # sammenlignes; avviket sendes som ::error-annotasjon (jobbloggen svarer
      # 403 uten token).
      - name: Kontrakten er i takt med koden
        working-directory: backend
        run: python tools/gen_openapi.py --check
      - name: pytest (SQLite)
        working-directory: backend
        run: python -m pytest tests -q
      # Utdataet sendes som ::error-annotasjon ved feil. Selve jobbloggen
      # svarer 403 uten token - ogsaa for offentlige repoer - mens
      # annotasjoner er aapne. Uten dette maa loggen eksporteres for haand
      # hver gang noe feiler her men ikke paa SQLite.
      - name: pytest (Postgres)
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bestefar_test
        run: |
          set +e
          python -m pytest tests -q --tb=short > pytest-out.txt 2>&1
          code=$?
          set -e
          cat pytest-out.txt
          if [ $code -ne 0 ]; then
            # Bare halen: GitHub kutter lange annotasjoner fra SLUTTEN, saa
            # et stort utdrag skjuler nettopp oppsummeringen vi er ute etter.
            python -c "t=open('pytest-out.txt',encoding='utf-8',errors='replace').read()[-3000:];print('::error title=pytest Postgres::'+t.replace('%','%25').replace(chr(13),'').replace(chr(10),'%0A'))"
          fi
          exit $code
