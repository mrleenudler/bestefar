name: Deploy backend

# backend_spec §0.1: push til main -> automatisk deploy til Fly.io.
# Krever repo-secret FLY_API_TOKEN (`flyctl tokens create deploy -a bestefar-api`).
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  test:
    name: Tester foer deploy
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bestefar_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }
      - run: pip install -r backend/requirements-dev.txt
      # Samme annotasjons-innpakning som i ci.yml. Uten den er en roed
      # test-jobb her uleselig - jobbloggen svarer 403 uten token - og det er
      # nettopp denne jobben som staar mellom en feil og produksjon.
      - name: pytest (Postgres)
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bestefar_test
        run: |
          set +e
          python -m pytest tests -q --tb=short > pytest-out.txt 2>&1
          code=$?
          set -e
          cat pytest-out.txt
          if [ $code -ne 0 ]; then
            python -c "t=open('pytest-out.txt',encoding='utf-8',errors='replace').read()[-3000:];print('::error title=pytest foer deploy::'+t.replace('%','%25').replace(chr(13),'').replace(chr(10),'%0A'))"
          fi
          exit $code

  deploy:
    name: flyctl deploy
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Tagget versjon, ikke @master: en flyttbar gren kan endre seg midt under
      # en deploy uten at noe i repoet er roert. 1.6 og ikke 1.5 - 1.5 er den
      # GitHub melder som «latest release», men den kjoerer node20. Sjekk
      # `runs.using` i setup-flyctl/action.yml foer du bytter tagg.
      - uses: superfly/flyctl-actions/setup-flyctl@1.6
      # NB: kjoer fra backend/. `--config backend/fly.toml ./backend` tolkes
      # relativt til app-katalogen og feiler med "missing an app name".
      # Skiller «secreten mangler» fra «deployen feilet». flyctl sier bare
      # «no access token available», som ogsaa er det den sier naar man rett
      # og slett ikke er logget inn - to helt ulike aarsaker, samme melding.
      - name: Sjekk at FLY_API_TOKEN er synlig for jobben
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error title=FLY_API_TOKEN mangler::Secreten er TOM i denne jobben. Den maa ligge under Settings > Secrets and variables > Actions, fanen Secrets - ikke Variables og ikke Dependabot - med navnet noeyaktig FLY_API_TOKEN. Environment-secrets er ogsaa usynlige her, siden jobben ikke deklarerer environment:."
            exit 1
          fi
          echo "FLY_API_TOKEN er satt (${#FLY_API_TOKEN} tegn)."

      # Utdataet sendes som ::error-annotasjon ved feil. Jobbloggen svarer 403
      # uten token - ogsaa for offentlige repoer - mens annotasjoner er aapne.
      - name: flyctl deploy
        working-directory: backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set +e
          flyctl deploy --remote-only > deploy-out.txt 2>&1
          code=$?
          set -e
          cat deploy-out.txt
          if [ $code -ne 0 ]; then
            python3 -c "t=open('deploy-out.txt',encoding='utf-8',errors='replace').read()[-3000:];print('::error title=flyctl deploy::'+t.replace('%','%25').replace(chr(13),'').replace(chr(10),'%0A'))"
          fi
          exit $code
