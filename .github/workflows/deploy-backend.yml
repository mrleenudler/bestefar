name: Deploy backend

# backend_spec §0.1: push til main -> automatisk deploy til Fly.io.
# Krever repo-secret FLY_API_TOKEN (`flyctl tokens create deploy -a bestefar-api`).
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  test:
    name: Tester foer deploy
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bestefar_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r backend/requirements-dev.txt
      - working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bestefar_test
        run: python -m pytest tests -q

  deploy:
    name: flyctl deploy
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # NB: kjoer fra backend/. `--config backend/fly.toml ./backend` tolkes
      # relativt til app-katalogen og feiler med "missing an app name".
      # Utdataet sendes som ::error-annotasjon ved feil. Jobbloggen svarer 403
      # uten token - ogsaa for offentlige repoer - mens annotasjoner er aapne.
      - name: flyctl deploy
        working-directory: backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set +e
          flyctl deploy --remote-only > deploy-out.txt 2>&1
          code=$?
          set -e
          cat deploy-out.txt
          if [ $code -ne 0 ]; then
            python3 -c "t=open('deploy-out.txt',encoding='utf-8',errors='replace').read()[-3000:];print('::error title=flyctl deploy::'+t.replace('%','%25').replace(chr(13),'').replace(chr(10),'%0A'))"
          fi
          exit $code
