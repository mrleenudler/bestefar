# Bestefar backend paa Fly.io (backend_spec §0.1: region Amsterdam, EU/EOES).
# Secrets settes med `flyctl secrets set` - ALDRI i denne fila.
app = "bestefar-api"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[deploy]
  # Migrasjonene kjoerer i en egen maskin FOER den nye versjonen slippes til.
  # Feiler de, stanses deployen og den gamle versjonen blir staaende.
  release_command = "alembic upgrade head"

[env]
  ENV = "prod"
  PORT = "8080"
  # Skjemaet styres av Alembic fra fase 2; ingen create_all() i produksjon.
  AUTO_CREATE_TABLES = "false"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 40
    hard_limit = 80

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
